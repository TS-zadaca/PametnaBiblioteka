name: Build and checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build SmartLibrary.sln --configuration Release
      - run: dotnet run --project tests/SmartLibrary.Users.Tests --configuration Release --no-build
